<script>
function logout() {
    let confirmLogout = confirm("Exit now?");
    if (confirmLogout) {
        window.location.href = "index.html";
    }
}

function openNotebook(subject) {
    alert("Error " + subject + " 505");
}

function showQOTD() {

    // Ask user to pick a number
    let pick = parseInt(prompt("Pick a number from 1 to 5"));

    // Check if input is valid
    if (isNaN(pick) || pick < 1 || pick > 5) {
        alert("Please enter a number from 1 to 5.");
        return;
    }

    // Random quotes
    var quote = "";

    switch (pick) {

        case 1:
            quote = "Success is built one small step at a time.";
            break;

        case 2:
            quote = "Your future self is watching your choices today.";
            break;

        case 3:
            quote = "Even slow progress is still progress.";
            break;

        case 4:
            quote = "Dreams work better when you do.";
            break;

        case 5:
            quote = "A calm mind is a powerful weapon.";
            break;

        default:
            quote = "No quote available.";
    }

    // Output
    alert("Quote of the Day" + quote);
}
</script>
