<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook - Math</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0a0f1a;
    color: #f5f5f5;
    font-family: "Segoe UI", sans-serif;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #101a2b;
    border-right: 1px solid #1f3a66;
    padding: 25px;
}

.sidebar h4 {
    font-weight: 600;
    color: #7fb3ff;
}

.nav-link {
    color: #d6e6ff;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
}

.nav-link:hover {
    background-color: #1a2b45;
    color: white;
}

/* Main */
.main-content {
    padding: 35px;
}

h3 {
    color: #7fb3ff;
}

/* Cards */
.custom-card {
    background: #121b30;
    border: 1px solid #1f3a66;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 0 12px rgba(90, 140, 255, 0.1);
}

.custom-card p {
    color: #dbe8ff;
}

.activity-list li {
    color: #c7dbff;
}

hr {
    border-color: #1f3a66;
}
</style>
</head>

<body>

<div class="d-flex">

    <div class="sidebar">
        <h4 class="text-center">Notebook</h4>
        <hr>

        <ul class="nav flex-column mt-4">
            <li><a class="nav-link" href="math.html">Math</a></li>
            <li><a class="nav-link" href="science.html">Science</a></li>
            <li><a class="nav-link" href="#">Log Out</a></li>
        </ul>
    </div>

    <div class="container-fluid main-content">

        <div class="row">

            <div class="col-md-8">
                <h3>Math Notes</h3>

                <div class="custom-card">
                    <p>Algebra Basics</p>
                </div>

                <div class="custom-card">
                    <p>Geometry and Angles</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="custom-card">
                    <h5>Math Activities</h5>
                    <ul class="activity-list">
                        <li>Problem Solving Set</li>
                        <li>Equation Quiz</li>
                        <li>Geometry Worksheet</li>
                    </ul>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
