<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Play Place</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color: #212529;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-box{
            background-color: #343a40;
            padding: 30px;
            border-radius: 15px;
            width: 420px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="game-box">

    <h1 class="text-info mb-4">Guessing Game</h1>

    <p>
        Guess the secret number from 1 to 10!
    </p>

    <button class="btn btn-info w-100 fw-bold" onclick="startGame()">
        Start Game
    </button>

</div>

<script>

function startGame(){

    let secretNumber = Math.floor(Math.random() * 10) + 1;

    let guess;
    let attempts = 0;

    do{

        guess = parseInt(prompt("Enter your guess from 1 to 10"));

        attempts++;

        if(isNaN(guess)){

            alert("Please enter a valid number.");

        }

        else if(guess > secretNumber){

            alert("Too high!");

        }

        else if(guess < secretNumber){

            alert("Too low!");

        }

        else{

            alert("🎉 Correct! You guessed the number in " + attempts + " attempts.");

        }

    }

    while(guess !== secretNumber);

}

</script>

</body>
</html>
