       <div class="collapse navbar-collapse" id="mynavbar">
    
    <ul class="navbar-nav" style="margin-left:10px;">
        <li class="nav-item">

        </li>
    </ul>

    </div>

</nav>

<script>    
    function errorButtons(event, clickedId) {
    event.preventDefault();

    let DashboardMsg = "Dashboard is locked. You have to log in first!";
    let NotebooksMsg = "Notebooks are locked. You have to log in first!";
    let TasksMsg = "Tasks are locked. You have to log in first!";
    let ProfileMsg = "Profile is locked. You have to log in first!";
    let LogOutMsg = "You don't have an account yet. You have to log in first!";

    if (clickedId === "error") {
        alert(DashboardMsg);
    } 
    else if (clickedId === "error2") {
        alert(NotebooksMsg);
    }
    else if (clickedId === "error3") {
        alert(TasksMsg);
    }
    else if (clickedId === "error4") {
        alert(ProfileMsg);
    }
    else if (clickedId === "error5") {
        alert(LogOutMsg);
    }

}
</script>



<div class="login-container">
    <h3 class="text-center mb-4 fw-bold"><strong>Login</strong></h3>

    <p class="text-center"><kbd style="color:#38bdf8;">Log back in to access your school information and tasks again!</kbd></p>

    <form>
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Username"list="username-suggestions" autocomplete="off">
    
    <datalist id="username-suggestions">
        <option value="What's after 67">
    </datalist>
</div>

        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password">
        </div>

        <button type="button" id="loginBtn" class="btn w-100 fw-bold" style="background-color:#EA88D2;" onclick="login()">
            Login
        </button>
    </form>

    <p id="errorMsg" class="text-danger mt-3 text-center"></p>
    <div class="text-center mt-2">
        <a href="#" class="text-light"><strong>Forgot username/password</strong></a>
    </div>
</div>

<script>
let attempt_counter = 0;

function login(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "What's after 67" && password === "68") {
        alert("Login successful!");
        attempt_counter = 0;
        document.getElementById("errorMsg").innerHTML = "";
        window.location.href = "dashboard.html";
    } else {
        attempt_counter++;
        document.getElementById("errorMsg").innerHTML =
            "Incorrect username or password. Attempt " + attempt_counter + " of 3";

        if (attempt_counter >= 3) {
            alert("Too many failed attempts!");
            document.getElementById("loginBtn").disabled = true;
        }
    }
}

//function logout() {

</script>
