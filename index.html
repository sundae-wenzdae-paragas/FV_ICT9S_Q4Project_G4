<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

    
        .navbar {
            background-color: #1f2937; 
        }

        .navbar .nav-link,
        .navbar-brand {
            color: #ffffff !important;
        }

        .navbar .nav-link:hover {
            color: #38bdf8 !important;
        }

        
        .login-container {
            max-width: 420px;
            margin: 80px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: #2563eb;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand" href="index.html">
            My Website
        </a>

        <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="contact us.html">Contact Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about us.html">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="help.html">Help</a>
                </li>
            </ul>

            <div class="d-flex ms-auto">
                <button onclick="window.location.href='registration.html'" 
                        class="btn btn-outline-light rounded-5 px-4">
                    Create Account
                </button>
            </div>
        </div>
    </div>
</nav>


<div class="login-container">
    <h3 class="text-center mb-4">Login</h3>

    <form>
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Username">
        </div>

        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password">
        </div>

        <button type="button" id="loginBtn" class="btn btn-primary w-100" onclick="login()">
            Login
        </button>
    </form>

    <p id="errorMsg" class="text-danger mt-3 text-center"></p>
    <div class="text-center mt-2">
        <a href="#">Forgot username/password</a>
    </div>
</div>

<script>
let attempt_counter = 0;

function login(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "6767" && password === "6868") {
        alert("Login successful!");
        attempt_counter = 0;
        document.getElementById("errorMsg").innerHTML = "";
        window.location.href = "home.html";
    } else {
        attempt_counter++;
        document.getElementById("errorMsg").innerHTML =
            "Incorrect username or password. Attempt " + attempt_counter + " of 3";

        if (attempt_counter >= 3) {
            alert("Too many failed attempts!");
            document.getElementById("loginBtn").disabled = true;
        }
    }
}

function logout() {
    if (confirm("Exit now?")) {
        window.location.href = "index.html";
    }
}
</script>

</body>
</html>
