<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background-color: #120a1a;
    color: #f5f5f5;
    font-family: "Segoe UI", sans-serif;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #1f102b;
    border-right: 1px solid #4a1f66;
    padding: 25px;
    position: fixed;
}

.sidebar h4 {
    font-weight: 600;
    color: #c77fff;
}

.nav-link {
    color: #f0ddff;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
}

.nav-link:hover {
    background-color: #2b1a45;
    color: white;
}

/* Main */
.main-content {
    margin-left: 260px;
    padding: 35px;
}

h2 {
    color: #c77fff;
}

/* Cards */
.subject-card {
    background: #1b1230;
    border: 1px solid #4a1f66;
    border-radius: 18px;
    padding: 20px;
    transition: 0.3s;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(190, 90, 255, 0.1);
}

.subject-card:hover {
    transform: translateY(-5px);
    background-color: #24163d;
}

.subject-card h4 {
    color: #e9ccff;
}

.subject-card p {
    color: #cdb7e8;
}

hr {
    border-color: #4a1f66;
}

/* Target your sidebar class - change '.sidebar' to whatever class you used */
.sidebar {
    background-color: #1b1230; /* Matching your theme */
    height: 100vh;
    width: 80px; /* Collapsed width */
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    border-right: 1px solid #4a1f66;
}

.sidebar:hover {
    width: 280px; /* Expanded width */
}

/* Optional: Hide text until hovered to keep it clean */
.sidebar .nav-link span {
    opacity: 0;
    transition: opacity 0.2s;
}

.sidebar:hover .nav-link span {
    opacity: 1;
}

/* This ensures the content area takes up all remaining space */
.flex-grow-1 {
    flex-grow: 1;
    transition: margin-left 0.4s ease; /* Matches your sidebar speed */
    display: flex;
    flex-direction: column;
}

/* Ensure your subject cards container allows for wrapping */
.main-content {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: flex-start;
}

/* Fix for the footer to stay at the bottom and match content width */
footer {
    width: 100%;
    background-color: #d81b60; /* Your pink color */
    padding: 20px;
    color: white;
}

</style>

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar">

        <h4 class="text-center">Student Home</h4>
        <hr>

        <ul class="nav flex-column mt-4">

            <li class="nav-item">
                <a class="nav-link" href="home.html">Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="qotd.html">QOTD</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="playplace.html">Play Place</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="notebook hub.html">Notebook Hub</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="calendar.html">Calendar</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="logout()">Logout</a>
            </li>

        </ul>

    </div>
    <!-- Main Content -->
   <div class="container">
<br>
    <h2>Home Page</h2>
   </div>

<div class="form-container">
    <h5></h5>
</div>   
<script>



function logout(){

    let confirmLogout = confirm("Exit now?");

    if(confirmLogout){

        window.location.href = "login.html";
    }
}

</script>



</body>
</html>
